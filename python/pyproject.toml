[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omniwebhook"
version = "0.4.0"
description = "Webhooks firmados que se emiten y se reciben igual en cualquier stack: verificación, frescura, idempotencia y reintentos con las mismas reglas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pablo Alaniz" }]
keywords = ["webhooks", "webhook", "signature", "hmac", "idempotency", "retries", "standard-webhooks", "mercadopago", "tiktok", "slack", "shopify"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# La librería de referencia del formato Standard Webhooks, para `omniwebhook.standard`.
standard = ["standardwebhooks>=1.3"]
# La firma asimétrica del formato estándar, `standard_public_key_scheme`.
ed25519 = ["cryptography>=42"]
# El transporte asincrónico de `omniwebhook.httpx`.
httpx = ["httpx>=0.27"]
# Las ayudas de `omniwebhook.starlette`, también para FastAPI.
starlette = ["starlette>=0.37"]
# Un cliente con pool para el almacén de `omniwebhook.postgres`.
postgres = ["psycopg[pool]>=3.2"]
# Las ayudas de `omniwebhook.django`.
django = ["django>=4.2"]
# El almacén de `omniwebhook.firestore`.
firestore = ["google-cloud-firestore>=2.16"]

[project.urls]
Homepage = "https://github.com/PabloAlaniz/omniwebhook"
Repository = "https://github.com/PabloAlaniz/omniwebhook"
Specification = "https://github.com/PabloAlaniz/omniwebhook/blob/main/spec/SPEC.md"
Issues = "https://github.com/PabloAlaniz/omniwebhook/issues"
Changelog = "https://github.com/PabloAlaniz/omniwebhook/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "django>=5.2.19",
    "django-stubs>=6.1.2",
    "google-cloud-firestore>=2.34.1",
    "httpx>=0.28.1",
    "hypothesis>=6.170.17",
    "import-linter>=2.17",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "psycopg[binary,pool]>=3.3.9",
    "pytest>=8.3",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.0",
    "redis>=8.2.0",
    "ruff>=0.8",
    "standardwebhooks>=1.3.0",
    "starlette>=1.10.0",
    "trustme>=1.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omniwebhook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing:skip-covered -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore:Using `httpx` with `starlette.testclient`"]
markers = ["integration: necesita un servicio externo (PostgreSQL, Redis o el emulador de Firestore)"]

[tool.coverage.run]
source_pkgs = ["omniwebhook"]
branch = true
# Estos almacenes se prueban contra el servicio de verdad, en los tests de integración.
omit = [
    "*/omniwebhook/adapters/stores/postgres.py",
    "*/omniwebhook/adapters/ledger/postgres.py",
    "*/omniwebhook/adapters/stores/firestore.py",
    "*/omniwebhook/postgres.py",
    "*/omniwebhook/firestore.py",
]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

[tool.mypy]
strict = true
files = ["src", "tests", "interop"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "TID"]
# El texto es español: las tildes y la ñ en docstrings y mensajes son a propósito.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# El generador se comprueba a sí mismo con assert y sólo usa secretos sintéticos.
"../tools/**" = ["S101", "S104", "S105", "SIM905"]
"interop/**" = ["S101"]

# Reglas de arquitectura. Las dependencias apuntan hacia adentro:
#   entrypoints → adapters → application → domain
# Ver docs/adr/0001-arquitectura-en-capas.md y docs/adr/0002-formato-de-salida-estandar.md.
[tool.importlinter]
root_package = "omniwebhook"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Las capas dependen hacia adentro"
type = "layers"
layers = [
    "omniwebhook.entrypoints",
    "omniwebhook.adapters",
    "omniwebhook.application",
    "omniwebhook.domain",
]

[[tool.importlinter.contracts]]
name = "La librería del formato estándar sólo entra por su adaptador"
type = "forbidden"
source_modules = ["omniwebhook"]
forbidden_modules = ["standardwebhooks"]
ignore_imports = ["omniwebhook.adapters.schemes.standard.reference_signer -> standardwebhooks"]

[[tool.importlinter.contracts]]
name = "El núcleo no depende de paquetes opcionales"
type = "forbidden"
source_modules = ["omniwebhook.domain", "omniwebhook.application"]
forbidden_modules = ["httpx", "starlette", "django", "psycopg", "google", "cryptography"]
